package:
  authors:
    - Tatsuya Koishi
  description: tomato-shriekerから、EPGStationの録画情報を扱えるようにするユーティリティ。
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/pooza/loquat
  version: 1.1.3
tools:
  - recording
  - reserves
  - help
epg_station:
  url: http://localhost:8888
http:
  retry:
    limit: 3
    seconds: 1
  # ⚠ ginseng-core 1.19.0 の HTTP#initialize が必須で読む (`/http/timeout/seconds`)。
  # 既定へ倒れないので、無いと HTTP を作った時点で ConfigError になる。
  timeout:
    seconds: 30
